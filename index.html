<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf7f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NutriTrack">
<meta name="description" content="NutriTrack — alimentação, atividade e evolução corporal.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>NutriTrack 4.0</title>
<style>
:root{--bg:#faf7f1;--paper:#fff;--ink:#292521;--muted:#898078;--line:#eee7de;--orange:#e99048;--orange2:#d97935;--yellow:#f5cf70;--coral:#e98b7d;--green:#77a98a;--red:#d96e62;--shadow:0 8px 28px rgba(91,67,44,.055);--radius:22px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f4c875;outline-offset:2px}
.app{max-width:540px;margin:auto;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom));background:var(--bg);position:relative}
header{padding:calc(16px + env(safe-area-inset-top)) 20px 10px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:43px;height:43px;object-fit:contain;border-radius:13px}.brand strong{font-size:20px;letter-spacing:-.7px}.brand strong span{color:var(--orange2)}.date-label{font-size:11px;color:var(--muted);font-weight:650}
main{padding:8px 17px 24px}.screen{display:none;animation:appear .18s ease}.screen.active{display:block}@keyframes appear{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:none}}
h1{font-size:27px;letter-spacing:-1px;margin:8px 0 4px}h2{font-size:17px;margin:0;letter-spacing:-.35px}h3{font-size:14px;margin:0}.desc{color:var(--muted);font-size:12px;margin:0 0 18px}.muted{color:var(--muted)}.tiny{font-size:10px;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:11px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}.link{border:0;background:none;color:var(--orange2);font-weight:750;font-size:12px;padding:6px}
.hero{background:linear-gradient(135deg,#f6d990,#f2ad79);border-radius:25px;padding:19px;color:#392d25;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:170px;height:170px;border:1px solid #ffffff65;border-radius:50%;right:-55px;top:-75px;box-shadow:0 0 0 22px #ffffff18,0 0 0 44px #ffffff12}.hero-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.eyebrow{text-transform:uppercase;letter-spacing:1.1px;font-size:9px;font-weight:800;color:#795a43}.date-chip{font-size:10px;background:#ffffff70;padding:7px 10px;border-radius:30px}.hero-row{display:flex;align-items:center;gap:17px;margin-top:14px;position:relative;z-index:1}.ring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:conic-gradient(var(--orange2) var(--p,0%),#ffffff85 0);position:relative}.ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#f8d59b}.ring-inner{position:relative;text-align:center}.ring-inner b{display:block;font-size:24px;letter-spacing:-1px}.ring-inner span{font-size:9px;color:#765b45}.hero-kcal{font-size:31px;font-weight:850;letter-spacing:-1.2px}.hero-kcal small{font-size:11px;font-weight:650}.remaining{font-size:11px;margin-top:5px;color:#715b49}.remaining b{font-size:14px}.bar{height:7px;border-radius:10px;background:#ffffff80;overflow:hidden;margin-top:15px;position:relative;z-index:1}.bar>i{display:block;height:100%;width:0;background:var(--orange2);border-radius:10px;transition:width .3s}.hero-foot{display:flex;justify-content:space-between;font-size:10px;color:#765b45;margin-top:7px;position:relative;z-index:1}
.macro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px}.macro{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 10px;text-align:center}.macro-ring{width:55px;height:55px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:conic-gradient(var(--c) var(--p),#f1eee9 0);position:relative}.macro-ring:before{content:"";position:absolute;inset:5px;background:#fff;border-radius:50%}.macro-ring b{position:relative;font-size:12px}.macro strong{display:block;font-size:12px}.macro small{font-size:10px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.metric-label{font-size:10px;color:var(--muted)}.metric-value{font-size:23px;font-weight:850;margin:7px 0 2px;letter-spacing:-.7px}.metric-foot{font-size:10px;color:var(--muted)}
.meal{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:9px}.meal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.meal-title{font-weight:800;font-size:13px}.meal-kcal{font-size:11px;color:var(--orange2);font-weight:800}.food-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #f3eee8;font-size:11px}.food-row small{display:block;color:var(--muted);margin-top:3px}.food-row b{white-space:nowrap}
.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800;font-size:12px;background:var(--orange);color:#fff;box-shadow:0 5px 13px #d9793520}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.soft{background:#fff1df;color:#9c602d;box-shadow:none}.btn.full{width:100%}.btn.small{padding:9px 11px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;display:grid;grid-template-columns:repeat(5,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#fffF;border-top:1px solid var(--line);backdrop-filter:blur(18px);z-index:5}.nav button{border:0;background:none;color:#958d85;font-size:9px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 1px}.nav .ico{font-size:19px}.nav button.active{color:var(--orange2)}.nav button.active .ico{background:#fff0dc;border-radius:11px;padding:4px 13px;margin-top:-4px}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;margin:7px 0 11px}.tabs{display:flex;gap:6px;background:#f0ece5;padding:4px;border-radius:13px;margin:10px 0}.tabs button{flex:1;border:0;border-radius:10px;padding:9px 4px;background:none;color:var(--muted);font-size:10px;font-weight:750}.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 2px 7px #55402a12}
.food-card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}.food-card .food-info{flex:1;min-width:0}.food-card strong{font-size:12px}.food-card small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.food-card .kcal{font-weight:800;color:var(--orange2);font-size:11px;white-space:nowrap}.round{border:0;background:#fff0dc;color:#9c602d;border-radius:10px;width:31px;height:31px;font-size:17px}
.calendar{background:#fff;border:1px solid var(--line);border-radius:20px;padding:13px}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal-grid .wd{font-size:9px;color:var(--muted);padding:5px 0}.day{border:0;background:none;border-radius:11px;min-height:43px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--ink)}.day.muted{color:#c9c2ba}.day.selected{background:#fbe5c7}.day.today{box-shadow:inset 0 0 0 1px var(--orange)}.dot{width:5px;height:5px;border-radius:50%;background:transparent}.dot.done{background:var(--green)}
.chart{width:100%;height:190px;display:block}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted)}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.field{margin:11px 0}.field label{display:block;font-size:11px;font-weight:750;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-back{position:fixed;inset:0;background:#29252166;display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px}.modal-back.show{display:flex}.modal{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:24px 24px 17px 17px;padding:19px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{border:0;background:#eee8df;border-radius:50%;width:30px;height:30px;font-size:19px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#292521;color:#fff;padding:11px 16px;border-radius:20px;font-size:11px;z-index:30;display:none;max-width:90%;text-align:center}
.empty{text-align:center;padding:23px;color:var(--muted);font-size:12px}.pill{display:inline-block;border-radius:20px;padding:5px 9px;background:#f6eee3;color:#91683f;font-size:10px;font-weight:750}.profile-logo{display:flex;align-items:center;gap:14px}.profile-logo img{width:76px;height:76px;object-fit:contain;border-radius:18px}.profile-logo p{font-size:11px;color:var(--muted);line-height:1.5}
@media(min-width:700px){body{padding:20px 0}.app{min-height:calc(100vh - 40px);border-radius:28px;overflow:hidden;box-shadow:0 12px 55px #58452a12}.nav{bottom:20px;border-radius:0 0 28px 28px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><img src="icon.png" alt="Logótipo NutriTrack"><strong>Nutri<span>Track</span></strong></div><div class="date-label" id="headerDate"></div></header>
<main>
<section class="screen active" id="screen-home"></section>
<section class="screen" id="screen-food"></section>
<section class="screen" id="screen-calendar"></section>
<section class="screen" id="screen-progress"></section>
<section class="screen" id="screen-profile"></section>
</main>
<nav class="nav">
<button data-tab="home" class="active"><span class="ico">⌂</span>Início</button>
<button data-tab="food"><span class="ico">◉</span>Alimentação</button>
<button data-tab="calendar"><span class="ico">▦</span>Calendário</button>
<button data-tab="progress"><span class="ico">↗</span>Progresso</button>
<button data-tab="profile"><span class="ico">☻</span>Perfil</button>
</nav>
</div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const KEY='nutritrack-v1',today=()=>new Date().toISOString().slice(0,10),uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),$=s=>document.querySelector(s),fmt=n=>Math.round(Number(n)||0).toLocaleString('pt-PT'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultFoods=[
{name:'Maçã',kcal:52,protein:.3,carbs:14,fat:.2,fiber:2.4,category:'Fruta'},{name:'Banana',kcal:89,protein:1.1,carbs:22.8,fat:.3,fiber:2.6,category:'Fruta'},{name:'Pão integral',kcal:247,protein:13,carbs:41,fat:4.2,fiber:7,category:'Cereais'},{name:'Iogurte natural',kcal:63,protein:5,carbs:7,fat:1.5,fiber:0,category:'Laticínios'},{name:'Salmão',kcal:208,protein:20,carbs:0,fat:13,fiber:0,category:'Peixe'},{name:'Batata cozida',kcal:87,protein:1.9,carbs:20.1,fat:.1,fiber:1.8,category:'Cereais'},{name:'Amêndoas',kcal:579,protein:21.2,carbs:21.6,fat:49.9,fiber:12.5,category:'Frutos secos'},{name:'Leite meio gordo',kcal:47,protein:3.4,carbs:4.8,fat:1.6,fiber:0,category:'Laticínios'}
].map(x=>({...x,id:uid(),source:'generic',favorite:false}));
let state=load(),tab='home',selected=today(),month=new Date(),foodFilter='all',search='',period='3m';
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(!s)return fresh();s.foods=Array.isArray(s.foods)?s.foods:defaultFoods;s.entries=Array.isArray(s.entries)?s.entries:[];s.weights=Array.isArray(s.weights)?s.weights:[];s.measures=Array.isArray(s.measures)?s.measures:[];s.steps=s.steps||{};s.water=s.water||{};s.meals=s.meals||[];s.profile=s.profile||{};s.goalCalories=s.goalCalories||2000;s.goalSteps=s.goalSteps||8000;s.goalProtein=s.goalProtein||140;s.goalCarbs=s.goalCarbs||220;s.goalFat=s.goalFat||65;return s}catch(e){return fresh()}}
function fresh(){return {foods:defaultFoods,entries:[],weights:[],measures:[],steps:{},water:{},meals:[],profile:{},goalCalories:2000,goalSteps:8000,goalProtein:140,goalCarbs:220,goalFat:65}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function sum(date){let a=state.entries.filter(x=>x.date===date);return a.reduce((o,x)=>{o.kcal+=+x.kcal||0;o.p+=+x.protein||0;o.c+=+x.carbs||0;o.f+=+x.fat||0;return o},{kcal:0,p:0,c:0,f:0})}
const mealNames={breakfast:'Pequeno-almoço',lunch:'Almoço',snack:'Lanche',dinner:'Jantar'};
function water(date){return +state.water[date]||0}function steps(date){return +state.steps[date]||0}
function toast(t){let x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>x.style.display='none',2200)}
function setTab(t){tab=t;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#screen-'+t).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}
function progressRing(val,goal,color){return `background:conic-gradient(${color} ${Math.min(100,goal?val/goal*100:0)}%,#f1eee9 0)`;}
function render(){ $('#headerDate').textContent=new Date().toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short'});home();food();calendar();progress();profile()}
function home(){let s=sum(selected),goal=+state.goalCalories,remaining=goal-s.kcal,pct=goal?s.kcal/goal*100:0;let macro=(label,val,target,color)=>`<div class="macro"><div class="macro-ring" style="${progressRing(val,target,color)}"><b>${fmt(val)}g</b></div><strong>${label}</strong><small>de ${fmt(target)} g</small></div>`;
let html=`<h1>Olá! 👋</h1><p class="desc">Um dia de cada vez. Vamos acompanhar o teu progresso.</p><div class="hero"><div class="hero-top"><span class="eyebrow">Resumo diário</span><span class="date-chip">${new Date(selected+'T12:00:00').toLocaleDateString('pt-PT',{day:'numeric',month:'short'})}</span></div><div class="hero-row"><div class="ring" style="--p:${Math.min(100,pct)}%"><div class="ring-inner"><b>${fmt(s.kcal)}</b><span>kcal consumidas</span></div></div><div><div class="hero-kcal">${fmt(Math.abs(remaining))} <small>kcal</small></div><div class="remaining">${remaining>=0?'restantes':'acima do objetivo'}<br><b>${Math.round(pct)}%</b> do objetivo</div></div></div><div class="bar"><i style="width:${Math.min(100,pct)}%;background:${remaining<0?'#c9534b':'#d97935'}"></i></div><div class="hero-foot"><span>0 kcal</span><span>Objetivo ${fmt(goal)} kcal</span></div></div>
<div class="macro-grid">${macro('Proteína',s.p,state.goalProtein,'#e99048')}${macro('Hidratos',s.c,state.goalCarbs,'#f0c45e')}${macro('Gordura',s.f,state.goalFat,'#e98b7d')}</div>
<div class="section-head"><h2>Atividade diária</h2><button class="link" data-action="profile">Definir objetivos</button></div><div class="grid2"><div class="metric"><div class="metric-label">💧 Água</div><div class="metric-value">${(water(selected)/1000).toFixed(1).replace('.',',')} L</div><div class="metric-foot">Objetivo ${state.profile.waterGoal||2500} ml</div><button class="btn soft small" data-action="water">+ 250 ml</button></div><div class="metric"><div class="metric-label">👟 Passos</div><div class="metric-value">${fmt(steps(selected))}</div><div class="metric-foot">Objetivo ${fmt(state.goalSteps)}</div><button class="btn soft small" data-action="steps">Registar</button></div></div>
<div class="section-head"><h2>As tuas refeições</h2><button class="link" data-tab="food">Ver biblioteca</button></div>`;
Object.entries(mealNames).forEach(([id,name])=>{let arr=state.entries.filter(x=>x.date===selected&&x.meal===id),k=arr.reduce((a,x)=>a+(+x.kcal||0),0);html+=`<div class="meal"><div class="meal-head"><span class="meal-title">${name}</span><span class="meal-kcal">${fmt(k)} kcal</span></div>${arr.length?arr.map(x=>`<div class="food-row"><span>${esc(x.name)}<small>${fmt(x.grams)} g</small></span><b>${fmt(x.kcal)} kcal</b></div>`).join(''):'<div class="tiny">Ainda não adicionaste alimentos.</div>'}<button class="link" data-action="add" data-meal="${id}">＋ Adicionar alimento</button></div>`});
$('#screen-home').innerHTML=html}
function food(){let arr=state.foods.filter(f=>(foodFilter==='fav'?f.favorite:foodFilter==='recent'?state.entries.some(e=>e.foodId===f.id):true)&&(!search||f.name.toLowerCase().includes(search.toLowerCase())));$('#screen-food').innerHTML=`<h1>Alimentação</h1><p class="desc">Regista refeições e gere a tua biblioteca.</p><div class="actions"><button class="btn" data-action="add">＋ Registar alimento</button><button class="btn secondary" data-action="newfood">Criar alimento</button><button class="btn secondary" data-action="meal-save">Guardar refeição</button></div><input class="search" id="foodSearch" placeholder="Pesquisar alimentos..." value="${esc(search)}"><div class="tabs"><button data-filter="all" class="${foodFilter==='all'?'active':''}">Todos</button><button data-filter="fav" class="${foodFilter==='fav'?'active':''}">Favoritos</button><button data-filter="recent" class="${foodFilter==='recent'?'active':''}">Recentes</button></div><div class="tiny" style="margin:8px 2px 10px">Biblioteca geral, produtos guardados e alimentos pessoais</div>${arr.length?arr.map(f=>`<div class="food-card"><div class="food-info"><strong>${esc(f.name)}</strong><small>${esc(f.source==='off'?'Open Food Facts':f.source==='personal'?'Pessoal':'Genérico')} · P ${f.protein||0}g · HC ${f.carbs||0}g · G ${f.fat||0}g / 100 g</small></div><span class="kcal">${fmt(f.kcal)} kcal</span><button class="round" data-fav="${f.id}" title="Favorito">${f.favorite?'★':'☆'}</button><button class="round" data-addfood="${f.id}">＋</button></div>`).join(''):'<div class="empty">Não foram encontrados alimentos.</div>'}<div class="section-head"><h2>Refeições guardadas</h2><span class="tiny">${state.meals.length} guardadas</span></div>${state.meals.length?state.meals.map(m=>`<div class="food-card"><div class="food-info"><strong>${esc(m.name)}</strong><small>${m.items.length} alimentos · ${fmt(m.kcal)} kcal por refeição</small></div><button class="btn soft small" data-usemeal="${m.id}">Adicionar</button></div>`).join(''):'<div class="card tiny">Ainda não guardaste refeições. Regista os alimentos de uma refeição e guarda-a para reutilizares mais tarde.</div>'}<div class="card" style="margin-top:15px"><h3>Pesquisa de produtos</h3><p class="tiny">Com ligação à Internet podes pesquisar produtos na base Open Food Facts. Os produtos adicionados ficam guardados neste dispositivo para utilização offline.</p><button class="btn secondary full" data-action="off-search">Pesquisar Open Food Facts</button></div>`}
function calendar(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells='';['S','T','Q','Q','S','S','D'].forEach(d=>cells+=`<div class="wd">${d}</div>`);for(let i=0;i<start;i++)cells+=`<button class="day muted" disabled></button>`;for(let d=1;d<=days;d++){let key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,has=state.entries.some(e=>e.date===key),sel=key===selected;cells+=`<button class="day ${sel?'selected':''} ${key===today()?'today':''}" data-date="${key}">${d}<i class="dot ${has?'done':''}"></i></button>`}$('#screen-calendar').innerHTML=`<h1>Calendário</h1><p class="desc">Consulta os teus registos dia a dia.</p><div class="calendar"><div class="cal-head"><button class="round" data-month="-1">‹</button><strong>${month.toLocaleDateString('pt-PT',{month:'long',year:'numeric'})}</strong><button class="round" data-month="1">›</button></div><div class="cal-grid">${cells}</div></div><div class="section-head"><h2>${new Date(selected+'T12:00:00').toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'})}</h2><button class="link" data-action="today">Hoje</button></div><div class="grid2"><div class="metric"><div class="metric-label">Calorias</div><div class="metric-value">${fmt(sum(selected).kcal)}</div><div class="metric-foot">de ${fmt(state.goalCalories)} kcal</div></div><div class="metric"><div class="metric-label">Água</div><div class="metric-value">${fmt(water(selected))} ml</div><div class="metric-foot">registados</div></div><div class="metric"><div class="metric-label">Passos</div><div class="metric-value">${fmt(steps(selected))}</div><div class="metric-foot">registados</div></div><div class="metric"><div class="metric-label">Alimentos</div><div class="metric-value">${state.entries.filter(e=>e.date===selected).length}</div><div class="metric-foot">registos</div></div></div>`}
function progress(){let ws=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date)),last=ws.at(-1),first=ws[0],diff=last&&first?last.kg-first.kg:0;let pts=ws.slice(-12);let chart='';if(pts.length>1){let min=Math.min(...pts.map(x=>x.kg))-.5,max=Math.max(...pts.map(x=>x.kg))+.5,coords=pts.map((p,i)=>`${20+i*260/(pts.length-1)},${160-(p.kg-min)/(max-min)*125}`).join(' ');chart=`<svg class="chart" viewBox="0 0 300 190" role="img" aria-label="Gráfico da evolução do peso"><path d="M20 160 H280" stroke="#eee7de" fill="none"/><polyline points="${coords}" fill="none" stroke="#e99048" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>{let xy=coords.split(' ')[i].split(',');return `<circle cx="${xy[0]}" cy="${xy[1]}" r="4" fill="#fff" stroke="#e99048" stroke-width="2"><title>${p.kg} kg · ${p.date}</title></circle>`}).join('')}</svg>`}else chart='<div class="empty">Regista pelo menos dois pesos para visualizar a evolução.</div>';
$('#screen-progress').innerHTML=`<h1>Progresso</h1><p class="desc">Acompanha a evolução do teu corpo.</p><div class="tabs">${[['1m','1 mês'],['3m','3 meses'],['6m','6 meses'],['1y','1 ano']].map(([v,l])=>`<button data-period="${v}" class="${period===v?'active':''}">${l}</button>`).join('')}</div><div class="card"><div class="section-head" style="margin:0 0 10px"><h2>Peso corporal</h2><button class="btn small" data-action="weight">＋ Registar</button></div><div class="grid2"><div><span class="tiny">Peso atual</span><div class="metric-value">${last?last.kg.toFixed(1).replace('.',',')+' kg':'—'}</div></div><div><span class="tiny">Variação total</span><div class="metric-value">${first&&last?(diff>0?'+':'')+diff.toFixed(1).replace('.',',')+' kg':'—'}</div></div></div>${chart}<div class="tiny">${ws.length} registos de peso</div></div><div class="section-head"><h2>Medidas corporais</h2><button class="btn small" data-action="measure">＋ Registar</button></div><div class="card"><p class="tiny">Sugestão: regista as medidas de duas em duas semanas.</p>${['Cintura','Abdómen','Peito','Braço','Coxa','Anca'].map(n=>{let x=[...state.measures].reverse().find(m=>m.name===n);return `<div class="food-row"><span>${n}<small>${x?x.date:'Sem registos'}</small></span><b>${x?x.value+' cm':'—'}</b></div>`}).join('')}</div><div class="card"><h3>Histórico de peso</h3>${ws.slice().reverse().slice(0,8).map(x=>`<div class="food-row"><span>${x.date}</span><b>${x.kg} kg</b></div>`).join('')||'<div class="tiny">Ainda não existem registos.</div>'}</div>`}
function profile(){let p=state.profile;$('#screen-profile').innerHTML=`<h1>Perfil</h1><p class="desc">Os teus dados e objetivos.</p><div class="card profile-logo"><img src="icon.png" alt="NutriTrack"><div><span class="pill">BOLACHA & LAU</span><h2 style="margin-top:6px">NutriTrack 4.0</h2><p>Pequenos passos, grandes resultados.</p></div></div><div class="section-head"><h2>Dados pessoais</h2><button class="link" data-action="edit-profile">Editar</button></div><div class="card"><div class="food-row"><span>Idade</span><b>${p.age||'—'} anos</b></div><div class="food-row"><span>Parâmetro da fórmula</span><b>${p.sex==='male'?'Masculino':p.sex==='female'?'Feminino':'—'}</b></div><div class="food-row"><span>Altura</span><b>${p.height||'—'} cm</b></div><div class="food-row"><span>Peso atual</span><b>${p.weight||'—'} kg</b></div><div class="food-row"><span>Objetivo</span><b>${esc(p.goal||'Por definir')}</b></div></div><div class="section-head"><h2>Objetivos nutricionais</h2><button class="link" data-action="edit-goals">Editar</button></div><div class="card"><div class="food-row"><span>Calorias</span><b>${fmt(state.goalCalories)} kcal</b></div><div class="food-row"><span>Proteína</span><b>${fmt(state.goalProtein)} g</b></div><div class="food-row"><span>Hidratos</span><b>${fmt(state.goalCarbs)} g</b></div><div class="food-row"><span>Gordura</span><b>${fmt(state.goalFat)} g</b></div><div class="food-row"><span>Passos</span><b>${fmt(state.goalSteps)}</b></div></div><div class="section-head"><h2>Dados e cópias de segurança</h2></div><div class="card actions"><button class="btn secondary" data-action="export">Exportar dados</button><button class="btn secondary" data-action="import">Importar cópia</button><input type="file" id="importFile" accept="application/json" hidden></div><p class="tiny">Os dados ficam guardados neste dispositivo. Exporta uma cópia regularmente. Criar uma conta não ativa sincronização na nuvem nesta versão.</p>`}
function openModal(content){$('#modal').innerHTML=content;$('#modalBack').classList.add('show')}function closeModal(){$('#modalBack').classList.remove('show')}
function foodForm(){openModal(`<div class="modal-head"><h2>Novo alimento</h2><button class="close">×</button></div><form id="newFood"><div class="field"><label>Nome</label><input name="name" required></div><div class="row"><div class="field"><label>kcal / 100 g</label><input name="kcal" type="number" min="0" required></div><div class="field"><label>Proteína (g)</label><input name="protein" type="number" step=".1" min="0"></div><div class="field"><label>Hidratos (g)</label><input name="carbs" type="number" step=".1" min="0"></div><div class="field"><label>Gordura (g)</label><input name="fat" type="number" step=".1" min="0"></div></div><button class="btn full">Guardar alimento</button></form>`)}
function logForm(foodId=null,meal='breakfast'){let opts=state.foods.map(f=>`<option value="${f.id}" ${f.id===foodId?'selected':''}>${esc(f.name)} · ${fmt(f.kcal)} kcal/100 g</option>`).join('');openModal(`<div class="modal-head"><h2>Adicionar ao diário</h2><button class="close">×</button></div><form id="logForm"><div class="field"><label>Alimento</label><select name="food" required>${opts}</select></div><div class="row"><div class="field"><label>Quantidade (g)</label><input name="grams" type="number" min="1" value="100" required></div><div class="field"><label>Refeição</label><select name="meal">${Object.entries(mealNames).map(([k,v])=>`<option value="${k}" ${meal===k?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>Data</label><input name="date" type="date" value="${selected}" required></div><button class="btn full">Adicionar ao diário</button></form>`)}
function profileForm(){let p=state.profile;openModal(`<div class="modal-head"><h2>Dados pessoais</h2><button class="close">×</button></div><form id="profileForm"><div class="row"><div class="field"><label>Idade</label><input name="age" type="number" min="14" max="100" value="${p.age||''}"></div><div class="field"><label>Altura (cm)</label><input name="height" type="number" min="100" max="230" value="${p.height||''}"></div></div><div class="field"><label>Sexo utilizado na fórmula</label><select name="sex"><option value="">Selecionar</option><option value="male" ${p.sex==='male'?'selected':''}>Masculino (+5)</option><option value="female" ${p.sex==='female'?'selected':''}>Feminino (−161)</option></select></div><div class="row"><div class="field"><label>Peso atual (kg)</label><input name="weight" type="number" step=".1" value="${p.weight||''}"></div><div class="field"><label>Peso pretendido (kg)</label><input name="targetWeight" type="number" step=".1" value="${p.targetWeight||''}"></div></div><div class="field"><label>Objetivo físico</label><select name="goal"><option>Manter peso</option><option>Perder peso</option><option>Aumentar peso</option><option>Ganhar massa muscular</option></select></div><div class="row"><div class="field"><label>Treinos por semana</label><input name="workouts" type="number" min="0" max="14" value="${p.workouts||0}"></div><div class="field"><label>Duração média (min)</label><input name="duration" type="number" min="0" value="${p.duration||0}"></div></div><div class="field"><label>Atividade geral</label><select name="activity"><option value="1.2">Sedentária</option><option value="1.375">Leve</option><option value="1.55">Moderada</option><option value="1.725">Elevada</option></select></div><button class="btn full">Guardar perfil e calcular</button></form>`)}
function goalsForm(){openModal(`<div class="modal-head"><h2>Objetivos diários</h2><button class="close">×</button></div><form id="goalsForm">${[['goalCalories','Calorias (kcal)'],['goalProtein','Proteína (g)'],['goalCarbs','Hidratos (g)'],['goalFat','Gordura (g)'],['goalSteps','Passos']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" type="number" min="0" value="${state[k]}"></div>`).join('')}<button class="btn full">Guardar objetivos</button></form>`)}
function saveMealForm(){let day=state.entries.filter(e=>e.date===selected);openModal(`<div class="modal-head"><h2>Guardar refeição</h2><button class="close">×</button></div>${day.length?`<p class="desc">Serão guardados os alimentos registados em ${new Date(selected+'T12:00:00').toLocaleDateString('pt-PT')}.</p><form id="saveMealForm"><div class="field"><label>Nome da refeição</label><input name="name" placeholder="Ex.: Pequeno-almoço habitual" required></div><div class="field"><label>Grupo de refeição</label><select name="meal">${Object.entries(mealNames).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><button class="btn full">Guardar para reutilizar</button></form>`:'<div class="empty">Ainda não existem alimentos registados nesta data. Adiciona primeiro os alimentos ao diário.</div>'}`)}
function measureForm(){openModal(`<div class="modal-head"><h2>Registar medida</h2><button class="close">×</button></div><form id="measureForm"><div class="field"><label>Medida</label><select name="name">${['Cintura','Abdómen','Peito','Braço','Coxa','Anca'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Valor (cm)</label><input name="value" type="number" step=".1" min="1" required></div><div class="field"><label>Data</label><input name="date" type="date" value="${today()}"></div><button class="btn full">Guardar medida</button></form>`)}
function calcMetabolic(){let p=state.profile;if(!p.age||!p.height||!p.weight||!p.sex)return null;let tmb=10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161),factor=+(p.activity||1.2),tdee=tmb*factor;return {tmb:Math.round(tmb),tdee:Math.round(tdee)}}
document.addEventListener('click',e=>{let n=e.target.closest('[data-tab]');if(n){setTab(n.dataset.tab);return}let f=e.target.closest('[data-filter]');if(f){foodFilter=f.dataset.filter;food();return}let d=e.target.closest('[data-date]');if(d){selected=d.dataset.date;render();return}let m=e.target.closest('[data-month]');if(m){month.setMonth(month.getMonth()+Number(m.dataset.month));calendar();return}let p=e.target.closest('[data-period]');if(p){period=p.dataset.period;progress();return}let fav=e.target.closest('[data-fav]');if(fav){let x=state.foods.find(x=>x.id===fav.dataset.fav);x.favorite=!x.favorite;save();return}let add=e.target.closest('[data-addfood]');if(add){logForm(add.dataset.addfood);return}let act=e.target.closest('[data-action]');if(act){let a=act.dataset.action;if(a==='add')logForm(null,act.dataset.meal||'breakfast');if(a==='newfood')foodForm();if(a==='weight')openModal(`<div class="modal-head"><h2>Registar peso</h2><button class="close">×</button></div><form id="weightForm"><div class="field"><label>Peso (kg)</label><input name="kg" type="number" step=".1" min="20" max="350" required></div><div class="field"><label>Data</label><input name="date" type="date" value="${today()}"></div><button class="btn full">Guardar peso</button></form>`);if(a==='measure')measureForm();if(a==='steps'||a==='water')openModal(`<div class="modal-head"><h2>${a==='steps'?'Registar passos':'Registar água'}</h2><button class="close">×</button></div><form id="simpleForm"><div class="field"><label>${a==='steps'?'Número de passos':'Quantidade (ml)'}</label><input name="value" type="number" min="0" value="${a==='water'?250:steps(selected)}" required></div><button class="btn full">Guardar</button></form>`);if(a==='edit-profile')profileForm();if(a==='edit-goals')goalsForm();if(a==='profile')setTab('profile');if(a==='today'){selected=today();render()}if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='nutritrack-backup-'+today()+'.json';link.click();URL.revokeObjectURL(u);toast('Cópia exportada')}if(a==='import')$('#importFile').click();if(a==='meal-save')saveMealForm();if(a==='off-search')openModal(`<div class="modal-head"><h2>Open Food Facts</h2><button class="close">×</button></div><p class="desc">Pesquisa produtos comerciais e guarda-os na biblioteca local.</p><form id="offForm"><div class="field"><label>Nome do produto</label><input name="q" placeholder="Ex.: iogurte natural" required></div><button class="btn full">Pesquisar produtos</button></form><div id="offResults"></div>`)}});
document.addEventListener('submit',async e=>{e.preventDefault();let form=e.target,fd=new FormData(form);if(form.id==='newFood'){let x=Object.fromEntries(fd);state.foods.unshift({id:uid(),...x,kcal:+x.kcal,protein:+x.protein||0,carbs:+x.carbs||0,fat:+x.fat||0,source:'personal',favorite:false});save();closeModal();toast('Alimento guardado')}if(form.id==='logForm'){let f=state.foods.find(x=>x.id===fd.get('food')),g=+fd.get('grams'),factor=g/100;state.entries.push({id:uid(),foodId:f.id,name:f.name,grams:g,meal:fd.get('meal'),date:fd.get('date'),kcal:f.kcal*factor,protein:(f.protein||0)*factor,carbs:(f.carbs||0)*factor,fat:(f.fat||0)*factor});selected=fd.get('date');save();closeModal();toast('Refeição atualizada')}if(form.id==='saveMealForm'){let group=fd.get('meal'),items=state.entries.filter(x=>x.date===selected&&x.meal===group).map(x=>({...x,date:undefined,id:undefined}));if(!items.length){toast('Não há alimentos nessa refeição');return}state.meals.unshift({id:uid(),name:fd.get('name'),items,kcal:items.reduce((a,x)=>a+(+x.kcal||0),0),created:today()});save();closeModal();toast('Refeição guardada')}if(form.id==='weightForm'){state.weights.push({date:fd.get('date'),kg:+fd.get('kg')});state.weights.sort((a,b)=>a.date.localeCompare(b.date));save();closeModal();toast('Peso guardado')}if(form.id==='measureForm'){state.measures.push({name:fd.get('name'),value:+fd.get('value'),date:fd.get('date')});save();closeModal();toast('Medida guardada')}if(form.id==='simpleForm'){if(form.querySelector('input').name==='value'&&$('#modal h2').textContent.includes('passos'))state.steps[selected]=+fd.get('value');else state.water[selected]=water(selected)+(+fd.get('value'));save();closeModal();toast('Registo guardado')}if(form.id==='profileForm'){state.profile=Object.fromEntries(fd);let c=calcMetabolic();if(c){let proposed=Math.round(c.tdee);if(confirm(`Estimativa: TMB ${c.tmb} kcal · TDEE ${c.tdee} kcal. Pretendes usar ${proposed} kcal como objetivo calórico?`))state.goalCalories=proposed;}save();closeModal();toast('Perfil guardado')}if(form.id==='goalsForm'){for(let k of ['goalCalories','goalProtein','goalCarbs','goalFat','goalSteps'])state[k]=+fd.get(k)||0;save();closeModal();toast('Objetivos guardados')}if(form.id==='offForm'){let q=fd.get('q'),box=$('#offResults');box.innerHTML='<p class="tiny">A pesquisar…</p>';try{let r=await fetch('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=8');let data=await r.json();box.innerHTML=(data.products||[]).filter(p=>p.product_name&&p.nutriments).map((p,i)=>{let n=p.nutriments;return `<div class="food-card"><div class="food-info"><strong>${esc(p.product_name)}</strong><small>${esc(p.brands||'Produto')} · ${fmt(n['proteins_100g'])}g proteína</small></div><span class="kcal">${fmt(n['energy-kcal_100g'])} kcal</span><button class="round" data-off-add="${i}">＋</button></div>`}).join('')||'<p class="tiny">Não foram encontrados resultados.</p>';window.offProducts=data.products||[]}catch(err){box.innerHTML='<p class="tiny">Não foi possível pesquisar. Verifica a ligação à Internet.</p>'}}});
document.addEventListener('click',e=>{if(e.target.closest('.close'))closeModal();let use=e.target.closest('[data-usemeal]');if(use){let meal=state.meals.find(x=>x.id===use.dataset.usemeal);if(meal){meal.items.forEach(x=>state.entries.push({...x,id:uid(),date:selected}));save();toast('Refeição adicionada ao diário')}return}let o=e.target.closest('[data-off-add]');if(o){let p=window.offProducts[+o.dataset.offAdd],n=p.nutriments||{};state.foods.unshift({id:uid(),name:p.product_name||'Produto',kcal:+n['energy-kcal_100g']||0,protein:+n.proteins_100g||0,carbs:+n.carbohydrates_100g||0,fat:+n.fat_100g||0,fiber:+n.fiber_100g||0,source:'off',favorite:false});save();closeModal();toast('Produto guardado para utilização offline')}});
$('#modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
document.addEventListener('input',e=>{if(e.target.id==='foodSearch'){search=e.target.value;let pos=e.target.selectionStart;food();let x=$('#foodSearch');x.focus();x.setSelectionRange(pos,pos)}});
$('#importFile').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let imported=JSON.parse(await file.text());if(!imported||!Array.isArray(imported.foods)||!Array.isArray(imported.entries))throw Error();if(confirm('A importação irá substituir os dados atuais deste dispositivo. Tens uma cópia de segurança?')){state=imported;localStorage.setItem(KEY,JSON.stringify(state));render();toast('Dados importados')}}catch(err){alert('Não foi possível ler esta cópia de segurança.')}e.target.value=''});
function migrate(){let p=state.profile||{};state.measures=state.measures||[];state.meals=state.meals||[];state.foods=state.foods.map(f=>({...f,source:f.source||'generic'}));state.entries=state.entries.map(e=>({...e,protein:e.protein||0,carbs:e.carbs||0,fat:e.fat||0}));}
migrate();render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body></html>
