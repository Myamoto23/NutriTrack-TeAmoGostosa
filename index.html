    /* NutriTrack 2.1 — identidade Bolacha & Lau */
    :root{--forest:#30201d;--forest2:#8d4032;--leaf:#ffd66f;--leaf2:#fff0d5;--cream:#fff8ee;--red:#ed6a60;--amber:#e99a4b;--shadow:0 12px 30px rgba(120,65,40,.09)}
    body{background:linear-gradient(160deg,#fff4d2 0%,#fff1e5 45%,#ffe2df 100%)}
    .app{background:rgba(255,250,243,.96)}
    .brandmark{background:linear-gradient(145deg,#ffe27a,#ff9875);color:#39211b;font-size:23px;box-shadow:0 4px 12px #ed987044}
    .brandname span{color:#d45d4f}.hero{background:linear-gradient(135deg,#35211e,#873f32 70%,#b64f40)}
    .ring{background:conic-gradient(#ffd66f var(--progress,0%),rgba(255,255,255,.16) 0)}
    .ring:before{background:#563027}.progress-fill{background:#ffd66f}.add-wide{background:linear-gradient(90deg,#ffe08a,#ffb18f);color:#3b211c}
    .nav-btn.active{color:#9e4437}.nav-btn.active .nav-icon{background:#ffedcf}
    .primary-btn{background:linear-gradient(100deg,#9f4537,#d76555)}
    .mascot-note{display:flex;align-items:center;gap:12px;background:linear-gradient(110deg,#fff0c8,#ffe0d6);border:1px solid #f6d7bd;border-radius:18px;padding:12px 14px;margin:13px 0;color:#43251e}
    .mascot-face{font-size:34px;line-height:1;filter:drop-shadow(0 3px 2px #a64c3830);animation:mascot-bob 2.8s ease-in-out infinite}
    @keyframes mascot-bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
    .macro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.macro-box{background:#fff;border:1px solid #f2e6dc;border-radius:14px;padding:10px}.macro-box b{display:block;font-size:17px}.macro-box span{font-size:10px;color:var(--muted)}.macro-track{height:5px;border-radius:8px;background:#f2eee8;margin-top:7px;overflow:hidden}.macro-track i{display:block;height:100%;border-radius:8px;background:#e58a63}
    .quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.quick-action{border:1px solid #f1dfd3;background:#fff;border-radius:15px;padding:12px;text-align:left;color:#492c25;font-size:12px;font-weight:750}.quick-action small{display:block;color:#987c70;font-size:10px;font-weight:500;margin-top:3px}
    .favorite-btn{border:0;background:#fff0d9;color:#b34f40;border-radius:9px;width:29px;height:29px;font-size:16px}.favorite-btn.on{background:#ffe1d9;color:#d34e48}
    @media(min-width:600px){body{padding:20px 0}.app{min-height:calc(100vh - 40px);border-radius:28px;overflow:hidden}.bottom-nav{bottom:20px;border-radius:0 0 28px 28px}}

    /* NutriTrack 2.1 — acabamento premium e controlos tácteis */
    :root{
      --shadow:0 8px 24px rgba(91,48,34,.065);
      --line:#f0e4d9;
      --ink:#30201d;
      --muted:#8c7770;
      --leaf:#ffd66f;
      --leaf2:#fff0d5;
    }
    html{scroll-behavior:smooth}
    body{background:linear-gradient(160deg,#fff5d8 0%,#fff0e8 52%,#ffe5e1 100%)}
    .app{border:1px solid rgba(210,135,103,.10);box-shadow:0 18px 55px rgba(111,64,44,.10)}
    header{padding-bottom:15px}
    .brandmark{border-radius:14px;transition:transform .22s,box-shadow .22s}
    .brandmark:active{transform:scale(.92) rotate(-5deg)}
    .brandname{letter-spacing:-.7px}
    .date-label{letter-spacing:1px;color:#a27d6d}
    .greeting{font-size:25px;line-height:1.12}
    .screen-title{font-size:25px;line-height:1.15}
    .screen-desc{line-height:1.5}
    .card,.metric,.meal-card,.calendar-card,.stats-card,.food-card{
      border:1px solid rgba(177,112,82,.11);
      box-shadow:0 5px 18px rgba(96,54,38,.045);
      transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
    }
    .meal-card{padding:14px 15px}
    .meal-card:active,.food-card:active,.quick-action:active{transform:scale(.985)}
    .hero{box-shadow:0 14px 30px rgba(112,53,42,.17)}
    .ring{box-shadow:0 0 0 7px rgba(255,255,255,.055)}
    .metric{background:linear-gradient(155deg,#fff 0%,#fffaf5 100%)}
    .metric-icon{background:#fff0d9}
    .metric-value{letter-spacing:-1px}
    .mini-track,.macro-track{background:#f3ece5}
    .mini-fill{background:linear-gradient(90deg,#e8a15c,#d96c58)}
    .macro-grid{gap:8px}
    .macro-box{box-shadow:inset 0 1px 0 #fff;background:linear-gradient(160deg,#fff 0%,#fffaf5 100%)}
    .macro-box:nth-child(1) .macro-track i{background:linear-gradient(90deg,#e5a04c,#d86b55)!important}
    .macro-box:nth-child(2) .macro-track i{background:linear-gradient(90deg,#f4c95f,#e99b4c)!important}
    .macro-box:nth-child(3) .macro-track i{background:linear-gradient(90deg,#e58a72,#bd6456)!important}
    .mascot-note{box-shadow:0 7px 18px rgba(180,101,73,.08);border-color:#f3d6bd}
    .mascot-face{font-size:36px}
    .quick-actions{gap:10px}
    .quick-action{position:relative;overflow:hidden;border-color:#f0ddce;background:linear-gradient(145deg,#fff,#fff8ef);box-shadow:0 3px 10px rgba(111,65,43,.04);transition:transform .16s,box-shadow .16s,border-color .16s}
    .quick-action:active{transform:scale(.97);box-shadow:0 1px 4px rgba(111,65,43,.08)}
    .quick-action small{color:#9a786a}
    .add-wide,.primary-btn,.secondary-btn,.round-btn,.icon-btn,.favorite-btn,.nav-btn,.text-btn,.day,.goal-row button{
      -webkit-tap-highlight-color:transparent;
      transition:transform .16s ease,filter .16s ease,box-shadow .16s ease,background .16s ease,color .16s ease;
    }
    .add-wide,.primary-btn{position:relative;overflow:hidden;box-shadow:0 7px 16px rgba(195,104,75,.16)}
    .add-wide{background:linear-gradient(100deg,#ffdf83 0%,#ffb08e 100%);color:#3b211c}
    .add-wide:active,.primary-btn:active{transform:translateY(1px) scale(.985);filter:saturate(1.12);box-shadow:0 3px 8px rgba(195,104,75,.14)}
    .primary-btn{background:linear-gradient(105deg,#a74739,#d96b58)}
    .secondary-btn{border-color:#f0d9ca;background:#fffaf5;color:#93483b}
    .secondary-btn:active,.round-btn:active,.icon-btn:active,.favorite-btn:active{transform:scale(.93)}
    .round-btn{border-radius:12px;background:#fffaf5;border-color:#efdfd4;color:#984c3d;font-weight:800;box-shadow:0 2px 6px rgba(111,65,43,.04)}
    .text-btn{color:#a64d3f;border-radius:9px}
    .text-btn:active{background:#fff0df}
    .icon-btn{background:#fff1e4;color:#9b5949;border:1px solid #f3e1d4}
    .favorite-btn{background:#fff3df;border:1px solid #f4e0c9}
    .favorite-btn.on{background:#ffe2d9;border-color:#f5c9bd;color:#d14e48}
    .bottom-nav{
      padding:9px 10px calc(9px + env(safe-area-inset-bottom));
      background:rgba(255,251,247,.94);
      border-top:1px solid rgba(221,183,160,.35);
      box-shadow:0 -8px 24px rgba(95,57,39,.055);
    }
    .nav-btn{border-radius:14px;gap:4px;padding:6px 4px;color:#a4938b;font-size:9px}
    .nav-btn .nav-icon{font-size:19px;min-width:35px;min-height:27px;display:grid;place-items:center;border-radius:10px}
    .nav-btn.active{color:#a4483b}
    .nav-btn.active .nav-icon{background:linear-gradient(145deg,#ffe7a4,#ffd6c5);padding:0;margin:0;box-shadow:0 3px 8px rgba(199,111,78,.12)}
    .nav-btn:active{transform:scale(.94)}
    .toolbar{background:rgba(255,255,255,.62);border:1px solid #f0e2d8;border-radius:15px;padding:7px 9px}
    .month-control{gap:8px}
    .month-control strong{font-size:13px;color:#57352c}
    .calendar-card{padding:14px 10px;background:linear-gradient(160deg,#fff 0%,#fffaf5 100%)}
    .day{min-height:43px;border-radius:13px;font-weight:650}
    .day.selected{background:linear-gradient(145deg,#9f4537,#d96b58);color:#fff;box-shadow:0 4px 10px rgba(164,72,58,.2)}
    .day.today:not(.selected){box-shadow:inset 0 0 0 1.5px #e7a35f;background:#fff7e8}
    .day:active{transform:scale(.9)}
    .day-dot{width:5px;height:5px}
    .selected-day-card{background:linear-gradient(145deg,#fff,#fff9f2)}

    @media(min-width:600px){.app{border-radius:28px;overflow:hidden}.bottom-nav{border-radius:0 0 28px 28px}}
  </style>


  <style id="nutritrack-v3-calendar">

<body>
<div class="app">

</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
  'use strict';
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const STORAGE='nutritrack-v1';
  const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const dateFromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
  const keyFromDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const defaults=[
    {id:'f1',name:'Banana',kcal:89,category:'Fruta'}, {id:'f2',name:'Maçã',kcal:52,category:'Fruta'},
    {id:'f3',name:'Batata cozida',kcal:87,category:'Legumes'}, {id:'f4',name:'Batata doce cozida',kcal:76,category:'Legumes'},
    {id:'f5',name:'Salmão grelhado',kcal:206,category:'Peixe'}, {id:'f6',name:'Atum ao natural',kcal:116,category:'Peixe'},
    {id:'f7',name:'Iogurte natural',kcal:61,category:'Laticínios'}, {id:'f8',name:'Pão de trigo',kcal:265,category:'Cereais'},
    {id:'f9',name:'Amêndoas',kcal:579,category:'Frutos secos'}, {id:'f10',name:'Abacate',kcal:160,category:'Fruta'}
  ];
  const load=()=>{try{return JSON.parse(localStorage.getItem(STORAGE))}catch(e){return null}};
  let state=load()||{foods:defaults,entries:[],steps:{},goalCalories:2400,goalSteps:10000};
  if(!state.foods)state.foods=defaults;if(!state.entries)state.entries=[];if(!state.steps)state.steps={};if(!state.water)state.water={};if(!state.weights)state.weights=[];if(!state.goalWater)state.goalWater=2000;state.foods.forEach(f=>{if(f.favorite===undefined)f.favorite=false;if(f.protein===undefined)f.protein=0;if(f.carbs===undefined)f.carbs=0;if(f.fat===undefined)f.fat=0;if(f.fiber===undefined)f.fiber=0});
  let activeTab='today',selectedDate=todayKey(),calendarMonth=dateFromKey(todayKey()).getMonth(),calendarYear=dateFromKey(todayKey()).getFullYear(),statsOffset=0,searchTerm='',favoritesOnly=false;
  const persist=()=>localStorage.setItem(STORAGE,JSON.stringify(state));
  const fmt=n=>Math.round(Number(n)||0).toLocaleString('pt-PT');
  const prettyDate=(key,opts={weekday:'long',day:'numeric',month:'long'})=>new Intl.DateTimeFormat('pt-PT',opts).format(dateFromKey(key));
  const entriesFor=key=>state.entries.filter(e=>e.date===key);
  const totalFor=key=>entriesFor(key).reduce((a,e)=>a+e.kcal,0);
  const stepsFor=key=>Number(state.steps[key]||0);
  const waterFor=key=>Number(state.water[key]||0);
  const macrosFor=key=>entriesFor(key).reduce((a,e)=>({protein:a.protein+(e.protein||0),carbs:a.carbs+(e.carbs||0),fat:a.fat+(e.fat||0),fiber:a.fiber+(e.fiber||0)}),{protein:0,carbs:0,fat:0,fiber:0});
  const weightFor=key=>{const a=state.weights.filter(x=>x.date<=key).sort((x,y)=>y.date.localeCompare(x.date));return a[0]?.kg||null};
  const meals=[['breakfast','Pequeno-almoço','☀️'],['lunch','Almoço','🥗'],['snack','Lanche','🍏'],['dinner','Jantar','🌙']];
  function save(){persist();render()}
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1900)}
  function setTab(tab){activeTab=tab;$$('.screen').forEach(s=>s.classList.remove('active'));$('#screen-'+tab).classList.add('active');$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
  function render(){ $('#headerDate').textContent=new Intl.DateTimeFormat('pt-PT',{day:'numeric',month:'short'}).format(new Date()).toUpperCase();renderToday();renderCalendar();renderFoods();renderStats();renderProfile(); }
  function renderToday(){
    const key=selectedDate,used=totalFor(key),goal=Number(state.goalCalories)||2400,remaining=goal-used,pct=Math.min(100,Math.round(used/goal*100));
    const d=prettyDate(key,{weekday:'long',day:'numeric',month:'long'}),isToday=key===todayKey(),m=macrosFor(key);
    const macroGoals=[150,265,75],macroItems=[['Proteína',m.protein,macroGoals[0],'#ef765d'],['Hidratos',m.carbs,macroGoals[1],'#f5b52e'],['Gordura',m.fat,macroGoals[2],'#86a96d']];
    const water=waterFor(key),steps=stepsFor(key),w=weightFor(key);
    const donut=(value,target,color,label,unit='g')=>`<div class="nt-donut-card"><div class="nt-donut" style="--arc:${Math.min(100,target?value/target*100:0)}%;--tone:${color}"><div><b>${fmt(value)}${unit}</b><small>${Math.round(target?Math.min(100,value/target*100):0)}%</small></div></div><strong>${label}</strong><span>${fmt(target)} ${unit}</span></div>`;
    $('#screen-today').innerHTML=`
      <div class="nt-greeting"><div><div class="greeting">${isToday?'Bom dia!':'O teu diário'} 👋</div><p class="screen-desc">${escapeHtml(d.charAt(0).toUpperCase()+d.slice(1))} · ${isToday?'Um passo de cada vez.':'Consulta os teus registos.'}</p></div><img src="mascot.png" alt="Bolacha, mascote NutriTrack"></div>
      <div class="nt-calorie-card"><div class="nt-card-head"><div><span class="nt-kicker">O teu dia</span><h2>Resumo de calorias</h2></div><span class="nt-date-pill">${isToday?'HOJE':'HISTÓRICO'}</span></div>
        <div class="nt-calorie-layout"><div class="nt-big-donut" style="--arc:${pct}%;"><div><strong>${fmt(used)}</strong><span>kcal consumidas</span></div></div><div class="nt-calorie-copy"><strong>${fmt(Math.abs(remaining))}</strong><span>${remaining>=0?'kcal disponíveis':'kcal acima do objetivo'}</span><small>Objetivo: ${fmt(goal)} kcal</small></div></div>
        <div class="nt-track"><i style="width:${pct}%"></i></div><div class="nt-track-labels"><span>0 kcal</span><b>${pct}% do objetivo</b><span>${fmt(goal)} kcal</span></div>
      </div>
      <div class="nt-section-title"><div><h2>Macronutrientes</h2><p>Distribuição diária</p></div><span class="nt-section-icon">◉</span></div>
      <div class="nt-donut-grid">${macroItems.map(([n,v,g,c])=>donut(v,g,c,n)).join('')}</div>
      <div class="nt-two-metrics">
        <div class="nt-info-card"><div class="nt-info-top"><span class="nt-info-icon water">💧</span><span>Hidratação</span></div><div class="nt-info-value">${(water/1000).toLocaleString('pt-PT',{maximumFractionDigits:1})}<small> L</small></div><div class="nt-muted">${fmt(water)} / ${fmt(state.goalWater)} ml</div><div class="nt-track pale"><i style="width:${Math.min(100,water/state.goalWater*100)}%;background:#54b7d4"></i></div><button class="nt-inline-action" data-action="water-add">＋ Adicionar 250 ml</button></div>
        <div class="nt-info-card"><div class="nt-info-top"><span class="nt-info-icon steps">👟</span><span>Passos</span></div><div class="nt-info-value">${fmt(steps)}</div><div class="nt-muted">Objetivo ${fmt(state.goalSteps)}</div><div class="nt-track pale"><i style="width:${Math.min(100,steps/state.goalSteps*100)}%;background:#f29a36"></i></div><button class="nt-inline-action" data-action="steps">＋ Registar passos</button></div>
      </div>
      <div class="nt-section-title"><div><h2>O teu peso</h2><p>Último registo para este dia</p></div><button class="nt-link" data-action="weight">＋ Registar</button></div>
      <div class="nt-weight-strip"><span class="nt-weight-icon">⚖</span><div><strong>${w?fmt(w)+' kg':'Ainda sem registo'}</strong><small>${w?'Peso corporal':'Regista o teu peso para acompanhar a evolução semanal'}</small></div><span class="nt-weight-arrow">›</span></div>
      <div class="nt-section-title"><div><h2>As minhas refeições</h2><p>O que consumiste hoje</p></div><button class="nt-link" data-action="add">＋ Adicionar</button></div>
      <div class="meal-list">${meals.map(([id,name,emoji])=>{const list=entriesFor(key).filter(e=>e.meal===id),total=list.reduce((a,e)=>a+e.kcal,0);return `<div class="meal-card nt-meal"><div class="meal-header"><div class="meal-title"><span>${emoji}</span>${name}</div><div class="meal-total">${fmt(total)} kcal</div></div>${list.length?list.map(e=>`<div class="food-line"><div>${escapeHtml(e.name)}<small>${fmt(e.grams)} g</small></div><div class="line-actions"><span class="line-kcal">${fmt(e.kcal)} kcal</span><button class="icon-btn" data-edit-entry="${e.id}" aria-label="Editar">✎</button><button class="icon-btn" data-delete-entry="${e.id}" aria-label="Eliminar">×</button></div></div>`).join(''):`<div class="meal-empty">Ainda não adicionaste alimentos.</div>`}</div>`}).join('')}</div>
      <button class="add-wide nt-add" data-action="add">＋ Adicionar alimento</button>`;
  }
  function renderCalendar(){
    const d=new Date(calendarYear,calendarMonth,1),first=(d.getDay()+6)%7,days=new Date(calendarYear,calendarMonth+1,0).getDate(),prevDays=new Date(calendarYear,calendarMonth,0).getDate();
    const title=new Intl.DateTimeFormat('pt-PT',{month:'long',year:'numeric'}).format(d);
    let cells='';for(let i=0;i<42;i++){let day,date,muted=false;if(i<first){day=prevDays-first+i+1;date=new Date(calendarYear,calendarMonth-1,day);muted=true}else if(i>=first+days){day=i-first-days+1;date=new Date(calendarYear,calendarMonth+1,day);muted=true}else{day=i-first+1;date=new Date(calendarYear,calendarMonth,day)}const key=keyFromDate(date),t=totalFor(key),has=entriesFor(key).length>0;let status=has?(t>state.goalCalories?'red':t>=state.goalCalories*.85?'green':'amber'):'';cells+=`<button class="day ${muted?'muted':''} ${key===selectedDate?'selected':''} ${key===todayKey()?'today':''}" data-day="${key}"><span>${day}</span><i class="day-dot ${status}"></i></button>`}
    $('#screen-calendar').innerHTML=`<h1 class="screen-title">Calendário</h1><p class="screen-desc">Consulta o teu histórico alimentar e de atividade.</p><div class="toolbar"><div class="month-control"><button class="round-btn" data-month="-1">‹</button><strong>${title.charAt(0).toUpperCase()+title.slice(1)}</strong><button class="round-btn" data-month="1">›</button></div><button class="text-btn" data-action="today">Hoje</button></div><div class="calendar-card"><div class="weekdays">${['S','T','Q','Q','S','S','D'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar-grid">${cells}</div></div><div class="legend"><span><i style="background:#84a96c"></i>Dentro do objetivo</span><span><i style="background:#dda84f"></i>Abaixo do objetivo</span><span><i style="background:#d56f62"></i>Acima do objetivo</span></div><div class="card selected-day-card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>${prettyDate(selectedDate,{weekday:'long',day:'numeric',month:'long'})}</h3><button class="text-btn" data-action="open-selected">Ver diário →</button></div><div class="selected-day-stats"><div class="small-stat"><span>Calorias</span><strong>${fmt(totalFor(selectedDate))} kcal</strong></div><div class="small-stat"><span>Passos</span><strong>${fmt(stepsFor(selectedDate))}</strong></div><div class="small-stat"><span>Água</span><strong>${fmt(waterFor(selectedDate))} ml</strong></div><div class="small-stat"><span>Peso</span><strong>${weightFor(selectedDate)?fmt(weightFor(selectedDate))+' kg':'—'}</strong></div></div></div>`;
  }
  function renderFoods(){
    const list=state.foods.filter(f=>(!favoritesOnly||f.favorite)&&f.name.toLowerCase().includes(searchTerm.toLowerCase()));
    $('#screen-foods').innerHTML=`<div class="nt-page-heading"><div><h1 class="screen-title">Alimentação</h1><p class="screen-desc">A tua biblioteca de alimentos.</p></div><button class="nt-round-action" data-action="new-food">＋</button></div>
      <label class="nt-search"><span>⌕</span><input id="foodSearch" placeholder="Pesquisar alimento..." value="${escapeHtml(searchTerm)}"><kbd>⌘ K</kbd></label>
      <div class="nt-filter-row"><button class="${!favoritesOnly?'active':''}" data-action="favorites">Todos os alimentos</button><button class="${favoritesOnly?'active':''}" data-action="favorites">♡ Favoritos</button><span>${list.length} itens</span></div>
      <div class="nt-food-intro"><div><b>O que vais comer?</b><small>Escolhe um alimento para o registar no teu diário.</small></div><span>🥗</span></div>
      <div class="food-list nt-food-list">${list.length?list.map((f,i)=>`<div class="food-card nt-food-card"><div class="nt-food-emoji">${['🥑','🍎','🥕','🍓','🥜','🥣'][i%6]}</div><div class="nt-food-main"><div class="food-name">${escapeHtml(f.name)}</div><div class="food-meta">${escapeHtml(f.category||'Alimento')} · por 100 g</div><div class="nt-food-macros"><span>${fmt(f.protein||0)}g proteína</span><span>${fmt(f.carbs||0)}g hidratos</span><span>${fmt(f.fat||0)}g gordura</span></div></div><div class="nt-food-side"><b>${fmt(f.kcal)}</b><small>kcal</small><button class="favorite-btn ${f.favorite?'on':''}" data-favorite="${f.id}" aria-label="Favorito">${f.favorite?'★':'☆'}</button></div><div class="nt-food-actions"><button class="nt-small-btn" data-edit-food="${f.id}">Editar</button><button class="nt-small-btn" data-delete-food="${f.id}">Eliminar</button></div></div>`).join(''):`<div class="empty-state"><div class="empty-icon">⌕</div>Não encontrámos alimentos com esse nome.</div>`}</div>
      <button class="add-wide nt-add" data-action="new-food">＋ Criar alimento</button><p class="subtle" style="font-size:10px;margin:14px 3px">Confirma sempre os valores nutricionais no rótulo do produto.</p>`;
  }
  function weekStart(offset=0){const d=dateFromKey(todayKey());const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd+offset*7);return d}
  function renderStats(){
    const start=weekStart(statsOffset),keys=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return keyFromDate(d)}),totals=keys.map(totalFor),stepVals=keys.map(stepsFor),sum=totals.reduce((a,b)=>a+b,0),active=totals.filter(v=>v>0).length,avg=active?sum/active:0,avgSteps=Math.round(stepVals.reduce((a,b)=>a+b,0)/7),onGoal=totals.filter(v=>v>0&&v<=state.goalCalories).length;
    const title=`${new Intl.DateTimeFormat('pt-PT',{day:'numeric',month:'short'}).format(dateFromKey(keys[0]))} – ${new Intl.DateTimeFormat('pt-PT',{day:'numeric',month:'short'}).format(dateFromKey(keys[6]))}`;
    const max=Math.max(state.goalCalories,...totals,1),bars=keys.map((k,i)=>`<div class="nt-bar-col"><span>${totals[i]?fmt(totals[i]):''}</span><div class="nt-bar-bg"><i class="${totals[i]>state.goalCalories?'over':''}" style="height:${Math.max(2,totals[i]/max*100)}%"></i></div><small>${['S','T','Q','Q','S','S','D'][i]}</small></div>`).join('');
    const wkeys=keys,weights=wkeys.map(k=>{const x=state.weights.find(v=>v.date===k);return x?Number(x.kg):null}),known=weights.map((v,i)=>v===null?null:{v,i}).filter(Boolean),latest=state.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-1)[0],prev=state.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-2)[0],weekDelta=known.length>1?known[known.length-1].v-known[0].v:null;
    let weightChart='<div class="nt-chart-empty">Regista o teu peso em vários dias para veres a evolução semanal.</div>';
    if(known.length){const vals=known.map(x=>x.v),lo=Math.min(...vals)-.4,hi=Math.max(...vals)+.4,r=Math.max(.8,hi-lo),pts=known.map(x=>[18+x.i*47,112-((x.v-lo)/r)*82]),line=pts.map(p=>p.join(',')).join(' ');weightChart=`<svg class="nt-weight-chart" viewBox="0 0 340 145" role="img" aria-label="Evolução semanal do peso">${[30,70,110].map(y=>`<line x1="14" y1="${y}" x2="326" y2="${y}" stroke="#f1e6dc" stroke-dasharray="4 5"/>`).join('')}<polyline points="${line}" fill="none" stroke="#ed812e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#fff" stroke="#ed812e" stroke-width="3"/>`).join('')}${['S','T','Q','Q','S','S','D'].map((d,i)=>`<text x="${18+i*47}" y="137" text-anchor="middle">${d}</text>`).join('')}</svg>`;}
    const pct=(v,g)=>Math.min(100,g?Math.round(v/g*100):0);
    $('#screen-stats').innerHTML=`<h1 class="screen-title">Progresso</h1><p class="screen-desc">Os teus resultados, semana após semana.</p>
      <div class="nt-week-switch"><button class="round-btn" data-stats-week="-1">‹</button><strong>${title}</strong><button class="round-btn" data-stats-week="1" ${statsOffset>=0?'disabled':''}>›</button></div>
      <div class="nt-highlight-grid"><div class="nt-highlight"><small>Calorias esta semana</small><strong>${fmt(sum)}</strong><span>kcal registadas</span></div><div class="nt-highlight"><small>Média de passos</small><strong>${fmt(avgSteps)}</strong><span>passos por dia</span></div></div>
      <div class="nt-panel"><div class="nt-panel-heading"><div><h2>Consumo de calorias</h2><p>Comparação com o teu objetivo diário</p></div><span class="nt-badge">7 DIAS</span></div><div class="nt-bars">${bars}</div><div class="nt-legend"><i></i> Consumo <b>—</b> objetivo ${fmt(state.goalCalories)} kcal</div></div>
      <div class="nt-panel"><div class="nt-panel-heading"><div><h2>Evolução do peso</h2><p>Registos de segunda a domingo</p></div><span class="nt-badge orange">PESO</span></div><div class="nt-weight-top"><strong>${latest?Number(latest.kg).toFixed(1).replace('.',',')+' kg':'—'}</strong><span>${weekDelta===null?'Sem comparação':`${weekDelta>0?'+':''}${weekDelta.toFixed(1).replace('.',',')} kg esta semana`}</span></div>${weightChart}<div class="nt-weight-foot"><span>Último registo: ${latest?prettyDate(latest.date,{day:'numeric',month:'short'}):'—'}</span><button class="nt-link" data-action="weight">＋ Registar peso</button></div></div>
      <div class="nt-panel"><div class="nt-panel-heading"><div><h2>Objetivos da semana</h2><p>Consistência é o que conta</p></div></div><div class="nt-goal-circles"><div class="nt-goal-circle" style="--p:${pct(onGoal,7)}%;--c:#87a96c"><div><b>${onGoal}/7</b><small>Calorias</small></div></div><div class="nt-goal-circle" style="--p:${pct(stepVals.filter(v=>v>=state.goalSteps).length,7)}%;--c:#ed9a39"><div><b>${stepVals.filter(v=>v>=state.goalSteps).length}/7</b><small>Passos</small></div></div><div class="nt-goal-circle" style="--p:${pct(keys.filter(k=>waterFor(k)>=state.goalWater).length,7)}%;--c:#62b5d1"><div><b>${keys.filter(k=>waterFor(k)>=state.goalWater).length}/7</b><small>Água</small></div></div></div></div>

  }
  function renderProfile(){
    const latest=state.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-1)[0];
    $('#screen-profile').innerHTML=`<h1 class="screen-title">Perfil</h1><p class="screen-desc">Personaliza a tua experiência NutriTrack.</p>
      <div class="nt-profile-hero"><div class="nt-profile-orb"><img src="mascot.png" alt="Mascote Bolacha"></div><div><span class="nt-kicker">BOLACHA & LAU</span><h2>NutriTrack</h2><p>Pequenos passos, grandes resultados.</p><span class="nt-version">VERSÃO 3.0</span></div></div>
      <div class="nt-profile-summary"><div><small>Último peso</small><strong>${latest?Number(latest.kg).toFixed(1).replace('.',',')+' kg':'—'}</strong></div><div><small>Objetivo diário</small><strong>${fmt(state.goalCalories)} kcal</strong></div><div><small>Passos</small><strong>${fmt(state.goalSteps)}</strong></div></div>
      <div class="nt-profile-label">Os meus objetivos</div><button class="nt-setting-row" data-action="goal"><span class="nt-setting-icon orange">◎</span><span><b>Objetivos diários</b><small>Calorias, passos e hidratação</small></span><strong>›</strong></button>
      <div class="nt-profile-label">Dados pessoais</div><button class="nt-setting-row" data-action="weight"><span class="nt-setting-icon peach">⚖</span><span><b>Peso corporal</b><small>${latest?`Último registo: ${Number(latest.kg).toFixed(1).replace('.',',')} kg`:'Regista e acompanha o teu peso'}</small></span><strong>›</strong></button>
      <button class="nt-setting-row" data-action="backup"><span class="nt-setting-icon blue">☁</span><span><b>Cópia de segurança</b><small>Exportar os teus registos em segurança</small></span><strong>›</strong></button>
      <div class="nt-profile-label">Aplicação</div><button class="nt-setting-row" data-action="goal"><span class="nt-setting-icon yellow">⚙</span><span><b>Preferências</b><small>Gerir os teus objetivos e definições</small></span><strong>›</strong></button>
      <button class="nt-setting-row" data-action="about"><span class="nt-setting-icon grey">ⓘ</span><span><b>Sobre a NutriTrack</b><small>Bolacha & Lau · versão 3.0</small></span><strong>›</strong></button>
      <p class="nt-profile-note">Os teus registos continuam guardados neste dispositivo. Faz cópias de segurança regularmente.</p>`;
  }
  function openModal(content){$('#modal').innerHTML=content;$('#modalBackdrop').classList.add('open')}
  function closeModal(){$('#modalBackdrop').classList.remove('open')}
  function openFoodModal(id=null){const f=id?state.foods.find(x=>x.id===id):null;openModal(`<div class="modal-head"><h3>${f?'Editar alimento':'Novo alimento'}</h3><button class="close-btn" data-close>×</button></div><form id="foodForm"><div class="field"><label for="foodName">Nome do alimento</label><input id="foodName" required maxlength="60" placeholder="Ex.: Arroz cozido" value="${escapeHtml(f?.name||'')}"></div><div class="field-row"><div class="field"><label for="foodKcal">Calorias por 100 g</label><input id="foodKcal" required type="number" min="0" max="10000" step="0.1" placeholder="Ex.: 130" value="${f?.kcal??''}"></div><div class="field"><label for="foodCategory">Categoria</label><select id="foodCategory">${['Fruta','Legumes','Carne','Peixe','Laticínios','Cereais','Frutos secos','Bebidas','Outros'].map(c=>`<option ${f?.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="field-row"><div class="field"><label for="foodProtein">Proteína / 100 g</label><input id="foodProtein" type="number" min="0" max="100" step="0.1" value="${f?.protein??0}"></div><div class="field"><label for="foodCarbs">Hidratos / 100 g</label><input id="foodCarbs" type="number" min="0" max="100" step="0.1" value="${f?.carbs??0}"></div></div><div class="field-row"><div class="field"><label for="foodFat">Gordura / 100 g</label><input id="foodFat" type="number" min="0" max="100" step="0.1" value="${f?.fat??0}"></div><div class="field"><label for="foodFiber">Fibra / 100 g</label><input id="foodFiber" type="number" min="0" max="100" step="0.1" value="${f?.fiber??0}"></div></div><button class="primary-btn" type="submit">${f?'Guardar alterações':'Guardar alimento'}</button></form>`);
    $('#foodForm').onsubmit=e=>{e.preventDefault();const name=$('#foodName').value.trim(),kcal=Number($('#foodKcal').value),category=$('#foodCategory').value,protein=Number($('#foodProtein').value)||0,carbs=Number($('#foodCarbs').value)||0,fat=Number($('#foodFat').value)||0,fiber=Number($('#foodFiber').value)||0;if(!name||!Number.isFinite(kcal)||kcal<0)return;const data={name,kcal,category,protein,carbs,fat,fiber};if(f){Object.assign(f,data)}else state.foods.unshift({id:crypto.randomUUID(),...data,favorite:false});save();closeModal();toast(f?'Alimento actualizado':'Alimento guardado')};}
  function openLogModal(entryId=null){const e=entryId?state.entries.find(x=>x.id===entryId):null;const food=e?state.foods.find(f=>f.id===e.foodId):null;const foodOptions=state.foods.map(f=>`<option value="${f.id}" ${e?.foodId===f.id?'selected':''}>${escapeHtml(f.name)} · ${fmt(f.kcal)} kcal/100 g</option>`).join('');openModal(`<div class="modal-head"><h3>${e?'Editar registo':'Adicionar alimento'}</h3><button class="close-btn" data-close>×</button></div><form id="logForm"><div class="field"><label for="logFood">Alimento</label><select id="logFood" required>${foodOptions}</select></div><div class="field-row"><div class="field"><label for="logGrams">Quantidade (g)</label><input id="logGrams" type="number" min="1" max="10000" step="1" required value="${e?.grams??100}"></div><div class="field"><label for="logMeal">Refeição</label><select id="logMeal">${meals.map(([id,n])=>`<option value="${id}" ${e?.meal===id?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="field"><label for="logDate">Data</label><input id="logDate" type="date" value="${e?.date||selectedDate}" required></div><div class="calc-preview"><span>Cálculo automático<br><small id="calcFormula">— kcal por 100 g</small></span><strong id="calcTotal">0 kcal</strong></div><button class="primary-btn" type="submit">${e?'Guardar registo':'Adicionar ao diário'}</button><button class="secondary-btn" type="button" data-new-food-inline>＋ Criar um alimento novo</button></form>`);
    const update=()=>{const f=state.foods.find(x=>x.id===$('#logFood').value),g=Number($('#logGrams').value)||0,k=f?Math.round(f.kcal*g/100):0;$('#calcFormula').textContent=f?`${fmt(f.kcal)} kcal × ${fmt(g)} g ÷ 100 · P ${fmt((f.protein||0)*g/100)} g`: 'Selecciona um alimento';$('#calcTotal').textContent=`${fmt(k)} kcal`};$('#logFood').onchange=update;$('#logGrams').oninput=update;update();
    $('#logForm').onsubmit=ev=>{ev.preventDefault();const f=state.foods.find(x=>x.id===$('#logFood').value),grams=Number($('#logGrams').value),date=$('#logDate').value,meal=$('#logMeal').value;if(!f||grams<=0||!date)return;const data={foodId:f.id,name:f.name,grams,meal,date,kcal:Math.round(f.kcal*grams/100),protein:(f.protein||0)*grams/100,carbs:(f.carbs||0)*grams/100,fat:(f.fat||0)*grams/100,fiber:(f.fiber||0)*grams/100};if(e)Object.assign(e,data);else state.entries.push({id:crypto.randomUUID(),...data});selectedDate=date;save();closeModal();toast(e?'Registo actualizado':'Alimento adicionado')};
    $('#modal').querySelector('[data-new-food-inline]').onclick=()=>{openFoodModal();};
  }
  function openStepsModal(){openModal(`<div class="modal-head"><h3>Registar passos</h3><button class="close-btn" data-close>×</button></div><form id="stepsForm"><div class="field"><label for="stepsValue">Número de passos</label><input id="stepsValue" type="number" min="0" max="200000" step="1" value="${stepsFor(selectedDate)}" required></div><div class="field"><label for="stepsDate">Data</label><input id="stepsDate" type="date" value="${selectedDate}" required></div><button class="primary-btn" type="submit">Guardar passos</button></form>`);$('#stepsForm').onsubmit=e=>{e.preventDefault();const n=Number($('#stepsValue').value),d=$('#stepsDate').value;if(n<0||!d)return;state.steps[d]=n;selectedDate=d;save();closeModal();toast('Passos guardados')};}
  function openWaterModal(amount=waterFor(selectedDate)){openModal(`<div class="modal-head"><h3>Registar água</h3><button class="close-btn" data-close>×</button></div><form id="waterForm"><div class="field"><label for="waterValue">Quantidade (ml)</label><input id="waterValue" type="number" min="0" max="10000" step="50" value="${amount}" required></div><div class="field"><label for="waterDate">Data</label><input id="waterDate" type="date" value="${selectedDate}" required></div><button class="primary-btn" type="submit">Guardar água</button></form>`);$('#waterForm').onsubmit=e=>{e.preventDefault();const n=Number($('#waterValue').value),d=$('#waterDate').value;if(n<0||!d)return;state.water[d]=n;selectedDate=d;save();closeModal();toast('Água registada')};}
  function openWeightModal(){openModal(`<div class="modal-head"><h3>Registar peso</h3><button class="close-btn" data-close>×</button></div><form id="weightForm"><div class="field"><label for="weightValue">Peso (kg)</label><input id="weightValue" type="number" min="20" max="350" step="0.1" placeholder="Ex.: 74.0" required></div><div class="field"><label for="weightDate">Data</label><input id="weightDate" type="date" value="${selectedDate}" required></div><button class="primary-btn" type="submit">Guardar peso</button></form><p class="subtle" style="font-size:10px">O peso é guardado por data. O histórico anterior mantém-se.</p>`);$('#weightForm').onsubmit=e=>{e.preventDefault();const kg=Number($('#weightValue').value),date=$('#weightDate').value;if(kg<20||kg>350||!date)return;state.weights=state.weights.filter(x=>x.date!==date);state.weights.push({date,kg});save();closeModal();toast('Peso guardado')};}
  function openGoalModal(){openModal(`<div class="modal-head"><h3>Os teus objectivos</h3><button class="close-btn" data-close>×</button></div><form id="goalForm"><div class="field"><label for="goalKcal">Objectivo diário de calorias (kcal)</label><input id="goalKcal" type="number" min="500" max="10000" value="${state.goalCalories}" required></div><div class="field"><label for="goalSteps">Objectivo diário de passos</label><input id="goalSteps" type="number" min="100" max="100000" value="${state.goalSteps}" required></div><button class="primary-btn" type="submit">Guardar objectivos</button><p class="subtle" style="font-size:10px;line-height:1.5">Define os teus próprios objectivos. O valor de calorias inicial é apenas um exemplo, não uma recomendação nutricional.</p></form>`);$('#goalForm').onsubmit=e=>{e.preventDefault();state.goalCalories=Number($('#goalKcal').value);state.goalSteps=Number($('#goalSteps').value);save();closeModal();toast('Objectivos actualizados')};}
  function handleAction(action){if(action==='add')openLogModal();if(action==='new-food')openFoodModal();if(action==='steps')openStepsModal();if(action==='water-add')openWaterModal(waterFor(selectedDate)+250);if(action==='water-custom')openWaterModal();if(action==='weight')openWeightModal();if(action==='favorites'){favoritesOnly=!favoritesOnly;searchTerm='';setTab('foods')} if(action==='goal')openGoalModal();if(action==='today'){selectedDate=todayKey();calendarMonth=dateFromKey(selectedDate).getMonth();calendarYear=dateFromKey(selectedDate).getFullYear();render();}if(action==='open-selected')setTab('today');if(action==='backup'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nutritrack-backup-'+todayKey()+'.json';a.click();URL.revokeObjectURL(url);toast('Cópia de segurança exportada')}if(action==='about')toast('NutriTrack 3.0 · Bolacha & Lau')}
  document.addEventListener('click',e=>{const nav=e.target.closest('[data-tab]');if(nav){setTab(nav.dataset.tab);return}const a=e.target.closest('[data-action]');if(a){handleAction(a.dataset.action);return}const fav=e.target.closest('[data-favorite]');if(fav){const f=state.foods.find(x=>x.id===fav.dataset.favorite);if(f){f.favorite=!f.favorite;persist();renderFoods();toast(f.favorite?'Adicionado aos favoritos':'Removido dos favoritos')}return}const ed=e.target.closest('[data-edit-entry]');if(ed){openLogModal(ed.dataset.editEntry);return}const del=e.target.closest('[data-delete-entry]');if(del){if(confirm('Queres eliminar este registo?')){state.entries=state.entries.filter(x=>x.id!==del.dataset.deleteEntry);save();toast('Registo eliminado')}return}const ef=e.target.closest('[data-edit-food]');if(ef){openFoodModal(ef.dataset.editFood);return}const df=e.target.closest('[data-delete-food]');if(df){if(confirm('Queres eliminar este alimento da biblioteca? Os registos antigos mantêm-se.')){state.foods=state.foods.filter(x=>x.id!==df.dataset.deleteFood);save();toast('Alimento eliminado')}return}const day=e.target.closest('[data-day]');if(day){selectedDate=day.dataset.day;render();return}const month=e.target.closest('[data-month]');if(month){calendarMonth+=Number(month.dataset.month);if(calendarMonth<0){calendarMonth=11;calendarYear--}if(calendarMonth>11){calendarMonth=0;calendarYear++}renderCalendar();return}const sw=e.target.closest('[data-stats-week]');if(sw){statsOffset=Math.min(0,statsOffset+Number(sw.dataset.statsWeek));renderStats();return}if(e.target.closest('[data-close]'))closeModal();});
  $('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
  document.addEventListener('input',e=>{if(e.target.id==='foodSearch'){searchTerm=e.target.value;const pos=e.target.selectionStart;renderFoods();const x=$('#foodSearch');x.focus();x.setSelectionRange(pos,pos)}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  persist();render();
})();
</script>
